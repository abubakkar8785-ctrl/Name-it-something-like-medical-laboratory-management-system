name: Build Windows Desktop App

# Builds MedicalLaboratory.exe and MedicalLaboratorySetup.exe on Windows.
# Runs automatically on every push to main and can also be started manually.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt pytest

      - name: Run Python tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

  build-windows:
    needs: run-python-tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build MedicalLaboratory.exe with PyInstaller
        run: pyinstaller medical_lab.spec

      - name: Smoke-test the built exe launches
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\MedicalLaboratory\MedicalLaboratory.exe" -PassThru
          Start-Sleep -Seconds 8

          if ($proc.HasExited) {
            Write-Error "MedicalLaboratory.exe exited immediately (exit code $($proc.ExitCode))."
            exit 1
          }

          Write-Host "Process is running (PID $($proc.Id)) after 8 seconds."
          Stop-Process -Id $proc.Id -Force

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: MedicalLaboratory-exe
          path: dist/MedicalLaboratory/

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\medlab_installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MedicalLaboratorySetup
          path: dist/installer/MedicalLaboratorySetup.exe
