{% extends "base.html" %}
{% block page_title %}{{ 'Edit Doctor' if doctor else 'New Doctor' }}{% endblock %}
{% block content %}
<div class="card">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group"><label>Full Name *</label>
        <input type="text" name="full_name" required value="{{ doctor.full_name if doctor else '' }}"></div>
      <div class="form-group"><label>Specialty</label>
        <input type="text" name="specialty" value="{{ doctor.specialty if doctor else '' }}"></div>
      <div class="form-group"><label>Phone</label>
        <input type="text" name="phone" value="{{ doctor.phone if doctor else '' }}"></div>
      <div class="form-group"><label>Email</label>
        <input type="email" name="email" value="{{ doctor.email if doctor else '' }}"></div>
      <div class="form-group"><label>Clinic / Hospital</label>
        <input type="text" name="clinic_hospital" value="{{ doctor.clinic_hospital if doctor else '' }}"></div>
      <div class="form-group"><label>Commission %</label>
        <input type="number" step="0.01" name="commission_percent" value="{{ doctor.commission_percent if doctor else 0 }}"></div>
      {% if doctor %}
      <div class="form-group">
        <label><input type="checkbox" name="active" {{ 'checked' if doctor.active }} style="width:auto;"> Active</label>
      </div>
      {% endif %}
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Doctor</button>
      <a href="{{ url_for('doctors.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
