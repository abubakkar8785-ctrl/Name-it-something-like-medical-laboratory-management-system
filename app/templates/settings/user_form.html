{% extends "base.html" %}
{% block page_title %}{{ 'Edit User' if user else 'New User' }}{% endblock %}
{% block content %}
<div class="card">
  <form method="POST">
    <div class="form-grid">
      {% if not user %}
      <div class="form-group"><label>Username *</label>
        <input type="text" name="username" required></div>
      {% endif %}
      <div class="form-group"><label>Full Name *</label>
        <input type="text" name="full_name" required value="{{ user.full_name if user else '' }}"></div>
      <div class="form-group"><label>Email</label>
        <input type="email" name="email" value="{{ user.email if user else '' }}"></div>
      <div class="form-group"><label>Role</label>
        <select name="role">
          {% for r in ['admin', 'lab_technician', 'receptionist', 'doctor', 'accountant', 'staff'] %}
          <option value="{{ r }}" {{ 'selected' if user and user.role == r }}>{{ r|capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group"><label>{{ 'New Password (leave blank to keep current)' if user else 'Password *' }}</label>
        <input type="password" name="password" {{ 'required' if not user }}></div>
      {% if user %}
      <div class="form-group">
        <label><input type="checkbox" name="active" {{ 'checked' if user.active }} style="width:auto;"> Active</label>
      </div>
      {% endif %}
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save User</button>
      <a href="{{ url_for('settings.users') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
