{% extends "base.html" %}
{% block page_title %}{{ 'Edit Test' if test else 'New Test' }}{% endblock %}
{% block content %}
<div class="card">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group"><label>Test Name *</label>
        <input type="text" name="name" required value="{{ test.name if test else '' }}"></div>
      <div class="form-group"><label>Category</label>
        <input type="text" name="category" value="{{ test.category if test else '' }}" placeholder="Hematology, Biochemistry...">
      </div>
      <div class="form-group"><label>Sample Type</label>
        <input type="text" name="sample_type" value="{{ test.sample_type if test else '' }}" placeholder="Blood, Urine, Stool...">
      </div>
      <div class="form-group"><label>Unit</label>
        <input type="text" name="unit" value="{{ test.unit if test else '' }}"></div>
      <div class="form-group"><label>Reference Range</label>
        <input type="text" name="reference_range" value="{{ test.reference_range if test else '' }}"></div>
      <div class="form-group"><label>Price *</label>
        <input type="number" step="0.01" name="price" required value="{{ test.price if test else 0 }}"></div>
      <div class="form-group"><label>Turnaround (hours)</label>
        <input type="number" name="turnaround_hours" value="{{ test.turnaround_hours if test else 24 }}"></div>
      {% if test %}
      <div class="form-group">
        <label><input type="checkbox" name="active" {{ 'checked' if test.active }} style="width:auto;"> Active</label>
      </div>
      {% endif %}
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Test</button>
      <a href="{{ url_for('settings.tests') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
