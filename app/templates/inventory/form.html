{% extends "base.html" %}
{% block page_title %}New Inventory Item{% endblock %}
{% block content %}
<div class="card">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group"><label>Name *</label><input type="text" name="name" required></div>
      <div class="form-group"><label>Category</label>
        <select name="category">
          <option>Reagent</option><option>Consumable</option><option>Equipment</option>
        </select>
      </div>
      <div class="form-group"><label>Unit</label><input type="text" name="unit" placeholder="box, ml, piece..."></div>
      <div class="form-group"><label>Quantity on Hand</label><input type="number" step="0.01" name="quantity_on_hand" value="0"></div>
      <div class="form-group"><label>Reorder Level</label><input type="number" step="0.01" name="reorder_level" value="0"></div>
      <div class="form-group"><label>Unit Cost</label><input type="number" step="0.01" name="unit_cost" value="0"></div>
      <div class="form-group"><label>Supplier</label><input type="text" name="supplier"></div>
      <div class="form-group"><label>Expiry Date</label><input type="date" name="expiry_date"></div>
      <div class="form-group"><label>Location</label><input type="text" name="location"></div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Item</button>
      <a href="{{ url_for('inventory.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
