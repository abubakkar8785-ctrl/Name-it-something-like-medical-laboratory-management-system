{% extends "base.html" %}
{% block page_title %}{{ 'Edit Patient' if patient else 'New Patient' }}{% endblock %}
{% block content %}
<div class="card">
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>First Name *</label>
        <input type="text" name="first_name" required value="{{ patient.first_name if patient else '' }}">
      </div>
      <div class="form-group">
        <label>Last Name *</label>
        <input type="text" name="last_name" required value="{{ patient.last_name if patient else '' }}">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" value="{{ patient.date_of_birth if patient else '' }}">
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select name="gender">
          {% for g in ['Male', 'Female', 'Other'] %}
          <option value="{{ g }}" {{ 'selected' if patient and patient.gender == g }}>{{ g }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ patient.phone if patient else '' }}">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ patient.email if patient else '' }}">
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" name="address" value="{{ patient.address if patient else '' }}">
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" name="city" value="{{ patient.city if patient else '' }}">
      </div>
      <div class="form-group">
        <label>Blood Group</label>
        <input type="text" name="blood_group" value="{{ patient.blood_group if patient else '' }}" placeholder="e.g. O+">
      </div>
      <div class="form-group">
        <label>Referring Doctor</label>
        <select name="referring_doctor_id">
          <option value="">— None —</option>
          {% for d in doctors %}
          <option value="{{ d.id }}" {{ 'selected' if patient and patient.referring_doctor_id == d.id }}>{{ d.full_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Emergency Contact Name</label>
        <input type="text" name="emergency_contact_name" value="{{ patient.emergency_contact_name if patient else '' }}">
      </div>
      <div class="form-group">
        <label>Emergency Contact Phone</label>
        <input type="text" name="emergency_contact_phone" value="{{ patient.emergency_contact_phone if patient else '' }}">
      </div>
    </div>
    <div class="form-group">
      <label>Allergies</label>
      <textarea name="allergies" rows="2">{{ patient.allergies if patient else '' }}</textarea>
    </div>
    <div class="form-group">
      <label>Medical Notes</label>
      <textarea name="medical_notes" rows="3">{{ patient.medical_notes if patient else '' }}</textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Patient</button>
      <a href="{{ url_for('patients.index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
